name: Build Spell Wheel HDR

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'hudhook_fork/**'
      - 'tests/listener-harness/**'
      - 'assets/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build-hdr.yml'
      - '.github/scripts/package-release.ps1'
  workflow_dispatch:
    inputs:
      settings_diagnostics:
        description: Build opt-in settings editor diagnostics
        type: boolean
        default: false
      publish_release:
        description: Publish a normal DLL release after successful checks
        type: boolean
        default: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Rust Nightly
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-11-13

      - name: Test controller, settings panel and diagnostic transport
        shell: pwsh
        run: |
          cargo test --locked --manifest-path tests/listener-harness/Cargo.toml
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          rustc --test --edition 2021 hudhook_fork/hudhook/src/settings_diagnostics.rs -o settings-diagnostics-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./settings-diagnostics-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build release DLL
        shell: pwsh
        env:
          SETTINGS_DIAGNOSTICS: ${{ inputs.settings_diagnostics }}
        run: |
          $env:SPELLWHEEL_DIAGNOSTIC_REVISION = git rev-parse HEAD
          if ($env:SETTINGS_DIAGNOSTICS -eq 'true') {
            cargo build --release --locked --features settings-diagnostics
          } else {
            cargo build --release --locked
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package DLL and provenance
        shell: pwsh
        env:
          SETTINGS_DIAGNOSTICS: ${{ inputs.settings_diagnostics }}
        run: ./.github/scripts/package-release.ps1

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.settings_diagnostics && 'spellwheel-settings-diagnostics-windows-x64' || 'spellwheel-hdr-windows-x64' }}
          path: |
            target/release/spellwheel.dll
            target/release/package/*
          if-no-files-found: error
          retention-days: 7

      - name: Publish GitHub Release
        if: ${{ !inputs.settings_diagnostics && (github.event_name == 'push' || inputs.publish_release) }}
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "wheel-details-$($env:GITHUB_SHA.Substring(0, 7))"
          gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Spell Wheel HDR - wheel details ($($env:GITHUB_SHA.Substring(0, 7)))" --notes-file target/release/package/release-notes.md --latest target/release/spellwheel.dll target/release/package/spellwheel-wheel-details-windows-x64.zip target/release/package/build-provenance.json target/release/package/SHA256SUMS.txt target/release/package/AtkinsonHyperlegible-OFL.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
